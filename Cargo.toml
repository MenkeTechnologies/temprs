[package]
name = "temprs"
version = "2.9.20"
authors = ["MenkeTechnologies <linux.dev25@gmail.com>"]
edition = "2024"
description = "A temporary file manager with stack mechanism"
license = "MIT"
repository = "https://github.com/MenkeTechnologies/temprs"
homepage = "https://menketechnologies.github.io/temprs/"
documentation = "https://docs.rs/temprs"
keywords = ["cli", "temporary-file"]
categories = ["command-line-utilities"]

[lib]
name = "temprs"
path = "src/lib.rs"

[[bin]]
name = "temprs"
path = "src/main.rs"

[profile.release]
lto = true
panic = "abort"
strip = true
codegen-units = 1
opt-level = 3

# `tp` is the short name; it lives in `src/bin/tp.rs`, which cargo discovers
# without a declaration. Pointing a second [[bin]] at `src/main.rs` made cargo
# warn on every build and every `cargo doc`.
# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
log = "0.4.29"
env_logger = "0.11.10"
simple_logger = "5.2.0"
clap = "4.6.0"
fs2 = "0.4"

[dev-dependencies]
criterion = "0.8"

[[bench]]
name = "benchmarks"
harness = false
